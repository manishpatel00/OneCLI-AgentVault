name: agentvault

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agentvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agentvault}
      POSTGRES_DB: ${POSTGRES_DB:-agentvault}
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "${ONECLI_BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agentvault}"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks:
      - agentvault

  agentvault:
    image: ghcr.io/agentvault/agentvault:${ONECLI_VERSION:-latest}
    container_name: agentvault
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${ONECLI_BIND_HOST:-127.0.0.1}:${ONECLI_APP_PORT:-10254}:10254"
      - "${ONECLI_BIND_HOST:-127.0.0.1}:${ONECLI_GATEWAY_PORT:-10255}:10255"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-agentvault}:${POSTGRES_PASSWORD:-agentvault}@postgres:5432/${POSTGRES_DB:-agentvault}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-}
      APP_URL: http://${ONECLI_BIND_HOST:-127.0.0.1}:${ONECLI_APP_PORT:-10254}
      GATEWAY_API_URL: http://${ONECLI_BIND_HOST:-127.0.0.1}:${ONECLI_GATEWAY_PORT:-10255}
    volumes:
      - app-data:/app/data
    env_file:
      - path: ../.env
        required: false
    networks:
      - agentvault

volumes:
  pgdata:
  app-data:

networks:
  agentvault:
    driver: bridge
